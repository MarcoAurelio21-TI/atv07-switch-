<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Exercício 07</title>
</head>
<body>

  <script>
    let opcao = prompt("Escolha um plano: 1 - Básico | 2 - Padrão | 3 - Premium");

    switch (opcao) {
      case "1":
        alert("Básico: R$ 20 por mês");
        break; 
      case "2":
        alert("Padrão: R$ 35 por mês");
        break;
      case "3":
        alert("Premium: R$ 50 por mês");
        break;
      default:
        alert("Opção inválida!");
    }
  </script>

</body>
</html>
